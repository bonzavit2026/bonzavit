<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BONZAVİT | Sana Özel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f7fff4, #fff8ed);
      color: #23452b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 30px;
      padding: 48px 28px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(45, 85, 50, 0.14);
      overflow: hidden;
    }

    /* MARKA ALANI */
    .brand {
      position: relative;
      display: inline-block;
      padding: 35px 30px 25px;
    }

    .logo {
      position: relative;
      z-index: 2;
      font-size: clamp(36px, 10vw, 48px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #e87924;
      opacity: 0;
      transform: translateY(8px);
      animation: logoIn 1s ease forwards;
      animation-delay: 0.3s;
    }

    /*
      İnce yaprak/filiz çizgileri.
      Emoji yerine CSS kullanıldığı için renkleri
      gerçekten yeşilden turuncuya dönüşebilir.
    */

    .sprout {
      position: absolute;
      width: 42px;
      height: 42px;
      opacity: 0;
      z-index: 1;
    }

    .sprout::before,
    .sprout::after {
      content: "";
      position: absolute;
      width: 15px;
      height: 28px;
      border: 2px solid #75b95e;
      border-radius: 100% 0 100% 0;
      background: transparent;
      transition: border-color 1.5s ease;
    }

    .sprout::before {
      left: 4px;
      top: 8px;
      transform: rotate(-32deg);
    }

    .sprout::after {
      right: 4px;
      top: 0;
      transform: rotate(32deg);
    }

    .sprout.one {
      left: -5px;
      top: 12px;
      transform: rotate(-25deg) scale(0.7);
      animation: sproutIn 1s ease forwards;
      animation-delay: 0.9s;
    }

    .sprout.two {
      right: -5px;
      top: 12px;
      transform: rotate(25deg) scale(0.7);
      animation: sproutIn 1s ease forwards;
      animation-delay: 1.1s;
    }

    .sprout.three {
      left: 10px;
      bottom: 0;
      transform: rotate(-45deg) scale(0.6);
      animation: sproutIn 1s ease forwards;
      animation-delay: 1.3s;
    }

    .sprout.four {
      right: 10px;
      bottom: 0;
      transform: rotate(45deg) scale(0.6);
      animation: sproutIn 1s ease forwards;
      animation-delay: 1.5s;
    }

    /* Yeşil → turuncu */
    .brand.orange .sprout::before,
    .brand.orange .sprout::after {
      border-color: #e87924;
    }

    .brand.orange .sprout {
      transition: color 1.5s ease;
    }

    @keyframes logoIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sproutIn {
      from {
        opacity: 0;
        transform: scale(0.2) rotate(0deg);
      }

      to {
        opacity: 1;
      }
    }

    /* RENK DÖNÜŞÜMÜ */
    .brand.orange {
      animation: orangeStart 1.5s ease forwards;
      animation-delay: 2.2s;
    }

    @keyframes orangeStart {
      from {
        filter: none;
      }

      to {
        filter: none;
      }
    }

    /* AYIRICI */
    .line {
      width: 0;
      height: 3px;
      background: #7bbf62;
      border-radius: 10px;
      margin: 8px auto 22px;
      animation: lineGrow 1s ease forwards;
      animation-delay: 1.8s;
    }

    @keyframes lineGrow {
      to {
        width: 75px;
      }
    }

    /* BAŞLIK */
    h1 {
      font-size: clamp(26px, 7vw, 32px);
      color: #285c34;
      margin: 18px 0 12px;
      opacity: 0;
      transform: translateY(10px);
      animation: textIn 1s ease forwards;
      animation-delay: 2.1s;
    }

    /* MESAJ */
    .message {
      font-size: 17px;
      line-height: 1.7;
      color: #536657;
      margin-bottom: 28px;
      opacity: 0;
      animation: textIn 1s ease forwards;
      animation-delay: 2.4s;
    }

    /* SLOGAN */
    .slogan {
      font-size: clamp(19px, 5vw, 23px);
      line-height: 1.4;
      font-weight: 900;
      color: #e87924;
      margin-top: 28px;
      opacity: 0;
      transform: scale(0.94);
      animation: sloganIn 1.2s ease forwards;
      animation-delay: 2.9s;
    }

    @keyframes textIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sloganIn {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }

      70% {
        opacity: 1;
        transform: scale(1.03);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #8b968c;
      opacity: 0;
      animation: textIn 1s ease forwards;
      animation-delay: 3.4s;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand" id="brand">

      <div class="sprout one"></div>
      <div class="sprout two"></div>
      <div class="sprout three"></div>
      <div class="sprout four"></div>

      <div class="logo">
        BONZAVİT
      </div>

    </div>

    <div class="line"></div>

    <h1>
      Yeni yaşın kutlu olsun!
    </h1>

    <p class="message">
      Yeni yaşında sağlık, mutluluk, enerji
      ve birbirinden güzel anılar seninle olsun.
      Her yeni gün sana yepyeni bir güzellik getirsin.
    </p>

    <div class="slogan">
      DAHA FAZLA ENERJİ,<br>
      DAHA İYİ BİR SEN :D
    </div>

    <div class="footer">
      Sana özel hazırlanmıştır.
    </div>

  </div>

  <script>
    /*
      Yaprakların yeşilden turuncuya dönüşmesini
      animasyonun sonunda başlatıyoruz.
    */
    setTimeout(function () {
      document.getElementById("brand").classList.add("orange");
    }, 2200);
  </script>

</body>
</html>
