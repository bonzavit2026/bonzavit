
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BONZAVİT | Sana Özel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7fff4, #fff8ed);
      color: #23452b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.95);
      border-radius: 28px;
      padding: 45px 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(45, 85, 50, 0.15);
      overflow: hidden;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #e87924;
      margin-bottom: 12px;
    }

    .leaf {
      font-size: 42px;
      display: inline-block;
      animation: grow 2s ease-in-out infinite alternate;
    }

    @keyframes grow {
      from {
        transform: scale(0.9) rotate(-5deg);
      }
      to {
        transform: scale(1.1) rotate(5deg);
      }
    }

    h1 {
      font-size: 30px;
      margin: 18px 0 12px;
      color: #285c34;
    }

    .message {
      font-size: 17px;
      line-height: 1.7;
      color: #536657;
      margin-bottom: 28px;
    }

    .slogan {
      font-size: 21px;
      font-weight: bold;
      color: #e87924;
      margin-top: 25px;
    }

    .line {
      width: 80px;
      height: 4px;
      background: #7bbf62;
      border-radius: 10px;
      margin: 20px auto;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #8b968c;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="leaf">🌿</div>

    <div class="logo">BONZAVİT</div>

    <div class="line"></div>

    <h1>Yeni yaşın kutlu olsun!</h1>

    <p class="message">
      Yeni yaşında sağlık, mutluluk, enerji
      ve birbirinden güzel anılar seninle olsun.
      Her yeni gün sana yepyeni bir güzellik getirsin.
    </p>

    <div class="slogan">
      DAHA FAZLA ENERJİ, DAHA İYİ BİR SEN :D
    </div>

    <div class="footer">
      Sana özel hazırlanmıştır.
    </div>

  </div>

</body>
</html>
